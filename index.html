<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Tetris Project</title>
    <style>
        body { margin: 0; display: flex; background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #game-container { flex: 2.5; height: 100vh; position: relative; } /* 게임 화면 비중 확대 */
        #sidebar { 
            flex: 1; 
            height: 100vh; 
            background-color: #262626; 
            border-left: 2px solid #444; 
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        #layers-wrapper { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: repeat(4, 1fr); /* 7개 항목을 세로로 4줄씩 분배 */
            grid-auto-flow: column; /* 가로가 아닌 세로 방향으로 먼저 배치 */
            gap: 10px; 
            overflow: hidden; 
            flex-grow: 1;
        }
        .layer-view { 
            background-color: #333; 
            padding: 8px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
        }
        .layer-label { font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .grid-2d { 
            display: grid; 
            grid-template-columns: repeat(5, 18px); 
            grid-template-rows: repeat(5, 18px); 
            gap: 1px; 
            background-color: #444; 
            border: 1px solid #555;
        }
        .cell { width: 18px; height: 18px; background-color: #111; }
        .cell.filled { background-color: #00ff00; box-shadow: inset 0 0 5px #0f0; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="sidebar">
        <h3 style="margin-top: 0; text-align: center;">Layer Slice View</h3>
        <div id="layers-wrapper"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
