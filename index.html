<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Tetris Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="left-sidebar">
        <div id="status-panel">
            <div style="font-size: 12px; color: #aaa;">SCORE</div>
            <div id="score">0</div>
        </div>
        <div id="hold-mino-panel">
            <div style="font-size: 12px; color: #f0f;">HOLD (C)</div>
            <div id="hold-list"></div>
        </div>
        <div id="next-mino-panel">
            <div style="font-size: 12px; color: #0cf;">NEXT</div>
            <div id="next-list"></div>
        </div>
    </div>
    
    <div id="game-container"></div>
    
    <div id="right-sidebar">
        <h4 style="text-align: center; margin: 0 0 10px 0; font-size: 14px;">Layer View</h4>
        <div id="layers-wrapper"></div>
    </div>

    <div id="main-menu" class="overlay">
        <h1>3D TETRIS</h1>
        <button id="start-btn" style="border-color: #0cf;">Game Start</button>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button id="settings-btn" class="sub-btn">Settings</button>
            <button id="controls-btn" class="sub-btn">How to Play</button>
        </div>
    </div>

    <div id="controls-menu" class="overlay" style="display: none;">
        <h1 style="color: #fff; font-size: 36px;">HOW TO PLAY</h1>
        <div class="settings-panel controls-text">
            <p><strong class="highlight-text">[ 이동 ]</strong><br>방향키 (상, 하, 좌, 우)</p>
            <p><strong class="highlight-text">[ 회전 ]</strong><br>X축 (앞뒤 굴리기): W / S<br>Y축 (좌우 돌기): A / D<br>Z축 (평면 회전): Q / E</p>
            <p style="margin-bottom: 0;"><strong class="highlight-text">[ 특수 조작 ]</strong><br>하드 드랍 (바로 내리기): Space<br>홀드 (블록 저장): C</p>
        </div>
        <button id="back-controls-btn" class="sub-btn">Back to Menu</button>
    </div>

    <div id="settings-menu" class="overlay" style="display: none;">
        <h1 style="color: #fff; font-size: 36px;">SETTINGS</h1>
        <div class="settings-panel">
            <div class="setting-row"><div><span>가로 크기 (X)</span><span id="val-x" class="val">5</span></div><input type="range" id="set-x" value="5" min="4" max="10"></div>
            <div class="setting-row"><div><span>세로 크기 (Z)</span><span id="val-z" class="val">5</span></div><input type="range" id="set-z" value="5" min="4" max="10"></div>
            <div class="setting-row"><div><span>층수 높이 (Y)</span><span id="val-y" class="val">7</span></div><input type="range" id="set-y" value="7" min="4" max="15"></div>
            <div class="setting-row"><div><span>낙하 속도 (ms)</span><span id="val-speed" class="val">1000</span></div><input type="range" id="set-speed" value="1000" min="200" max="2000" step="100"></div>
        </div>
        <button id="back-btn" class="sub-btn">Back to Menu</button>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1 style="color: #ff3333; text-shadow: 0 0 15px #ff3333;">GAME OVER</h1>
        <p style="font-size: 24px; margin-bottom: 30px;">Final Score: <span id="final-score" style="color: #0f0; font-weight: bold;">0</span></p>
        <div style="display: flex; gap: 20px;">
            <button id="restart-btn" style="border-color: #0f0;">Restart</button>
            <button id="menu-btn">Main Menu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
